name: Publish InkFlow desktop release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Check tag and package versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $desktopVersion = (Get-Content -Raw -LiteralPath ./desktop/package.json | ConvertFrom-Json).version
          $agentVersion = (Get-Content -Raw -LiteralPath ./agent/pyproject.toml | Select-String -Pattern 'version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          $tagVersion = $env:RELEASE_TAG -replace '^v', ''
          if ($desktopVersion -ne $agentVersion -or $tagVersion -ne $desktopVersion) {
            throw "Release tag and package versions must match: tag=$tagVersion desktop=$desktopVersion agent=$agentVersion"
          }

      - name: Build local engine
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./agent[build,lightvoice]"
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name inkflow-engine `
            --paths ./agent/src `
            --collect-submodules mcp.server `
            --collect-submodules mcp.shared `
            --collect-data mcp `
            --collect-all sherpa_onnx `
            --hidden-import soundfile `
            --hidden-import mcp.types `
            --exclude-module mcp.cli `
            --distpath ./dist/engine `
            --workpath ./build/pyinstaller `
            --specpath ./build/pyinstaller `
            ./agent/scripts/inkflow_app_server_entry.py

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Publish Windows installer and updater metadata
        working-directory: desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npx electron-builder --win nsis --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content -Raw -LiteralPath ./package.json | ConvertFrom-Json).version
          $output = [System.IO.Path]::GetFullPath((Join-Path "..\artifacts\desktop" $version))
          $assets = @(Get-ChildItem -LiteralPath $output -File | Where-Object {
            $_.Name -eq "InkFlow-Setup-$version.exe" -or
            $_.Name -eq "InkFlow-Setup-$version.exe.blockmap" -or
            $_.Name -eq "latest.yml"
          } | ForEach-Object { $_.FullName })
          if (-not ($assets | Where-Object { $_ -like "*latest.yml" }) -or -not ($assets | Where-Object { $_ -like "*.exe" })) {
            throw "The desktop build did not produce the installer and latest.yml required by electron-updater."
          }
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "墨流（InkFlow）桌面版 $version" --notes "墨流（InkFlow）$version 桌面版。"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag @assets --clobber
