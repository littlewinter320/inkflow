[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inkflow-novel-agent"
version = "0.4.1"
description = "墨流（InkFlow）——面向长篇中文网文的三 Agent 创作引擎"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "InkFlow contributors"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "keyring>=25,<27",
  "mcp>=1.20,<2",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.15,<7"]

[project.scripts]
inkflow = "inkflow.cli:main"
inkflow-mcp = "inkflow.mcp_server:main"
inkflow-app-server = "inkflow.app_server:main"

[tool.setuptools.packages.find]
where = ["src"]
