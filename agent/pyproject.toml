[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "inkflow-novel-agent"
version = "0.5.2"
description = "墨流（InkFlow）——面向长篇中文网文的四 Agent 协作创作引擎"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "InkFlow contributors"}]
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx>=0.27,<1",
  "keyring>=25,<27",
  "mcp>=1.20,<2",
  "pydantic>=2.9,<3",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.15,<7"]
lightvoice = [
  "sherpa-onnx>=1.13,<2",
  "soundfile>=0.12,<1",
]
review = [
  "torch>=2.2,<3",
  "transformers>=4.44,<6",
]
rag = ["sentence-transformers>=3,<6"]
voice = [
  "funasr>=1.2,<2",
  "qwen-tts>=0.1,<1",
  "soundfile>=0.12,<1",
  "torch>=2.4,<3",
  "torchaudio>=2.4,<3",
]

[project.scripts]
inkflow = "inkflow.cli:main"
inkflow-mcp = "inkflow.mcp_server:main"
inkflow-app-server = "inkflow.app_server:main"

[tool.setuptools.packages.find]
where = ["src"]
